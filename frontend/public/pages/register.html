<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — AZPKEY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-page">
  <nav class="auth-nav">
    <a href="/" class="nav-logo">
      <span class="logo-mark">AZP</span><span class="logo-key">KEY</span>
      <span class="logo-since">since 2025</span>
    </a>
    <a href="/pages/login.html" class="btn-ghost">Sign in</a>
  </nav>
  <div class="auth-body">
    <div class="auth-card">
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Start managing your API keys for free</p>
      <div class="form-error" id="formError"></div>
      <div class="form-success" id="formSuccess"></div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Buat Username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@gmail.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Password <span style="color:var(--text-3);font-weight:400">(min. 8 characters)</span></label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" />
      </div>
      <button class="btn-primary form-submit" id="registerBtn">
        <span id="registerBtnText">Create account</span>
      </button>
      <div class="form-footer">
        Already have an account? <a href="/pages/login.html">Sign in</a>
      </div>
    </div>
  </div>
</div>
<script src="../js/api.js"></script>
<script>
  if (api.getToken()) window.location.href = '/pages/dashboard.html';

  const btn = document.getElementById('registerBtn');
  const btnText = document.getElementById('registerBtnText');
  const errEl = document.getElementById('formError');
  const successEl = document.getElementById('formSuccess');

  btn.addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    errEl.classList.remove('show');
    successEl.classList.remove('show');

    if (!username || !email || !password) return (errEl.textContent = 'All fields required.', errEl.classList.add('show'));
    if (password.length < 8) return (errEl.textContent = 'Password must be at least 8 characters.', errEl.classList.add('show'));
    if (!/^[a-zA-Z0-9_]+$/.test(username)) return (errEl.textContent = 'Username: letters, numbers, underscore only.', errEl.classList.add('show'));

    btn.disabled = true;
    btnText.innerHTML = '<span class="loading-spinner"></span>';

    try {
      const data = await api.register({ username, email, password });
      localStorage.setItem('azpkey_token', data.token);
      localStorage.setItem('azpkey_user', JSON.stringify(data.user));
      successEl.textContent = 'Account created! Redirecting...';
      successEl.classList.add('show');
      setTimeout(() => window.location.href = '/pages/dashboard.html', 1200);
    } catch (err) {
      errEl.textContent = err.message || 'Registration failed.';
      errEl.classList.add('show');
      btn.disabled = false;
      btnText.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
