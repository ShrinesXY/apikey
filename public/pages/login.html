<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AZPKEY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-page">
  <nav class="auth-nav">
    <a href="/" class="nav-logo">
      <span class="logo-mark">AZP</span><span class="logo-key">KEY</span>
      <span class="logo-since">since 2025</span>
    </a>
    <a href="/pages/register.html" class="btn-outline btn-sm">Create account</a>
  </nav>
  <div class="auth-body">
    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your AZPKEY account</p>
      <div class="form-error" id="formError"></div>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-primary form-submit" id="loginBtn">
        <span id="loginBtnText">Sign in</span>
      </button>
      <div class="form-footer">
        Don't have an account? <a href="/pages/register.html">Sign up free</a>
      </div>
    </div>
  </div>
</div>
<script src="../js/api.js"></script>
<script>
  // Redirect if already logged in
  if (api.getToken()) window.location.href = '/pages/dashboard.html';

  const btn = document.getElementById('loginBtn');
  const btnText = document.getElementById('loginBtnText');
  const errEl = document.getElementById('formError');

  function showError(msg) {
    errEl.textContent = msg;
    errEl.classList.add('show');
  }

  document.getElementById('password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btn.click();
  });

  btn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    errEl.classList.remove('show');

    if (!email || !password) return showError('Please fill in all fields.');

    btn.disabled = true;
    btnText.innerHTML = '<span class="loading-spinner"></span>';

    try {
      const data = await api.login({ email, password });
      localStorage.setItem('azpkey_token', data.token);
      localStorage.setItem('azpkey_user', JSON.stringify(data.user));
      window.location.href = '/pages/dashboard.html';
    } catch (err) {
      showError(err.message || 'Login failed. Please try again.');
      btn.disabled = false;
      btnText.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
